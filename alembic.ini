# ============================================================
#  Alembic yapilandirmasi
#  Veritabani adresi burada SABIT DEGILDIR; alembic/env.py dosyasi
#  adresi uygulama ayarlarindan (HOTEL_DB_URL / .env) okur. Boylece
#  baglanti bilgisi tek yerde tutulur ve depoya sizmaz.
# ============================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Goc dosyasi adlandirmasi: 2026_08_15_1430-a1b2c3d4_aciklama.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sqlalchemy.url env.py tarafindan calisma aninda ayarlanir.
sqlalchemy.url =

[post_write_hooks]
# Uretilen goc dosyalarini otomatik bicimlendir.
# Not: ruff burada kullanilamaz - bir Rust ikilisidir ve Alembic'in bekledigi
# "console_scripts" giris noktasini saglamaz ("Could not find entrypoint
# console_scripts.ruff"). Goc dosyalari lint denetiminden zaten muaftir
# (bkz. pyproject.toml -> tool.ruff.extend-exclude) ve test.ps1 tum projeyi
# ruff ile ayrica tarar.
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
