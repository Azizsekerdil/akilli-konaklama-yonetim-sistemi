# ============================================================
#  gitleaks yapilandirmasi
#
#  Depoda **gercek bir sir yoktur**. Bu dosya, tarayicinin entropi
#  sezgisiyle yakaladigi ve elle incelenip yanlis pozitif oldugu dogrulanan
#  UC durumu kayit altina alir. Her istisna dar kapsamlidir ve gerekcesi
#  yazilidir; boylece bir sonraki inceleyen kararı gozden gecirebilir.
#
#  Kural: buraya yeni bir madde eklemek, bir sirri gizlemek icin DEGIL,
#  incelenmis bir yanlis pozitifi belgelemek icindir. Gerekce yazilmayan
#  madde kabul edilmez.
# ============================================================

[extend]
useDefault = true

[allowlist]
description = "Incelenmis yanlis pozitifler"

paths = [
  # Bu dosyanin kendisi (icinde ornek desenler gecer).
  '''\.gitleaks\.toml$''',
]

regexes = [
  # 1) Testlerdeki uydurma parolalar. Turkce, insan tarafindan yazilmis,
  #    hicbir sistemde gecerli olmayan dizgeler. Ornek:
  #    current_password="YanlisParola123" / new_password="YeniGucluParola2026"
  #    Bunlar test fikstürüdür; bir hesabin parolasi degildir.
  '''(Yeni|Yanlis|Eski|Gecici|Demo|Ornek|Test)[A-Za-z]*Parola[A-Za-z0-9]*''',

  # 2) Kaynak koddaki ve testlerdeki acikca "ornek" olarak isaretlenmis
  #    yer tutucular. Gercek bir degerin bu bicimde olmasi mumkun degildir.
  '''ORNEK-[A-Z\-]+''',

  # 3) Demo veri ureteci parolalari (DemoMudur2026! vb.). Demo verisi
  #    zaten herkese acik ornek veridir; app/infrastructure/seed/demo_data.py
  #    icindeki DEMO_WARNING bunu acikca soyler ve gercek kurulumda demo
  #    verisinin silinmesi gerektigini belirtir.
  '''Demo(Mudur|Onburo|Kat|Teknik|Muhasebe)2026!''',
]

[[rules]]
# Varsayilan "generic-api-key" kuralinin belge tablolarindaki uzun satirlarda
# uretttigi gurultuyu daraltir: Markdown tablolarinda anahtar bulunmaz.
id = "generic-api-key"
description = "Genel API anahtari (belge tablolari haric)"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\|:|<=|=>|:|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
secretGroup = 1
entropy = 3.5
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

[rules.allowlist]
description = "Markdown belgeleri: prosa ve tablo satirlari anahtar tasimaz"
paths = ['''\.md$''']
